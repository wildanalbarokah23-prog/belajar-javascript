<!DOCTYPE html>
<html>
<head>
  <title>Ubah Warna</title>
  <style>
    body {
      text-align: center;
      padding-top: 100px;
      font-family: sans-serif;
      transition: background-color 0.3s;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Klik tombol untuk ubah warna latar</h1>
  <button onclick="ubahWarna()">Ubah Warna</button>

  <script>
    const warnaList = ["lightblue", "lightgreen", "lightyellow", "lightpink", "lavender"];

    function ubahWarna() {
      const warnaAcak = warnaList[Math.floor(Math.random() * warnaList.length)];
      document.body.style.backgroundColor = warnaAcak;
    }
  </script>
</body>
</html>
